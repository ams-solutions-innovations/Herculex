name: herculex
description: "Herculex — fitness, nutrition, and recovery tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Local persistence (Phase 1: profile + simple KV)
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4

  # Cloud backend (auth, Postgres sync, realtime, storage). Replaces the
  # native-Kotlin Firebase auth bridge — supabase_flutter is pure Dart, so
  # iOS gets a working auth path for the first time.
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  connectivity_plus: ^6.1.0

  # Local DB (Phase 2: workouts, sets, sessions)
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5

  # Charts (Insights tab)
  fl_chart: ^0.69.0

  # Nutrition (Phase 3: OpenFoodFacts + barcode)
  http: ^1.2.2
  mobile_scanner: ^7.4.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1

  # Progress photos (Phase D)
  image_picker: ^1.1.2

  # Sharing the workout-finish card to social apps
  share_plus: ^10.1.4

  # Live notifications (ongoing workout while app is backgrounded)
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  device_calendar: ^4.3.1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  health: ^13.3.1
  google_mlkit_text_recognition: ^0.16.0
  wakelock_plus: ^1.2.10
  quick_actions: ^1.1.0
  flutter_media_controller: ^1.0.3

  # Phone-local accelerometer source for assisted rep tracking (Phase 10)
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0
  # Used by test/buddy/rls_frozen_test.dart to hash-pin 0003_sync_rls.sql.
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/data/exercises.json
    - assets/data/movements.json
    - assets/data/rep_tracking_profiles.json
    - assets/data/hercul_rules.json
    - assets/data/food_database_eu.v1.json
    - assets/images/
    - assets/images/exercises/
    - assets/programs/
  fonts:
    # Variable fonts (SIL OFL 1.1 — licenses in assets/fonts/). Flutter maps
    # TextStyle.fontWeight onto the `wght` axis, so one file covers the whole
    # weight range: Manrope 200–800, Space Grotesk 300–700.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_ios.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/images/app_icon_foreground.png"
