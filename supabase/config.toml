# A string used to distinguish different Supabase projects on the same host
# (the CLI's own default is the working-directory name). Set to the real
# Herculex project ref so it doubles as a human-visible marker of which
# remote project this repo targets. This field does NOT perform the actual
# `supabase link` — that state lives in the gitignored `supabase/.temp/`
# directory and is (re)established per machine by running
# `supabase link --project-ref ldzgyzigvbwofbswitrv`. See
# docs/supabase-migrations.md.
project_id = "ldzgyzigvbwofbswitrv"

[functions.gemini-analyze]
verify_jwt = true

# `product-catalogue-publish` je bila odstranjena 2026-09-02. Ni nosila
# nobene svoje skrivnosti — service-role kljuc je rabila samo zato, da obide
# RLS na `product_catalogue`, kar SECURITY DEFINER rutina
# `product_catalogue_submit()` (migracija 0018) naredi bolj varno, atomarno
# in brez hladnega zagona. Klient jo klice neposredno prek `rpc()`.
# Glej docs/edge-functions-prod-arhitektura.md.

# Never false: the function derives the account to delete from the verified
# JWT alone, so an unverified caller could delete an arbitrary user.
[functions.delete-account]
verify_jwt = true
